<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Quản lý công việc & Đánh giá KPI</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('kpi_system_org_config');
          if (raw) {
            var cfg = JSON.parse(raw);
            if (cfg && (cfg.shortName || cfg.departmentName)) {
              var tag = cfg.shortName ? (' - ' + cfg.shortName) : (' - ' + cfg.departmentName);
              document.title = 'Hệ thống Quản lý công việc & Đánh giá KPI' + tag;
            }
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#1F4E78" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Hệ thống Quản lý công việc và Đánh giá KPI - Phòng Kế hoạch Tài chính, Ban Quản lý dự án ĐTXD CT Giao thông và Nông nghiệp PTNT tỉnh Đắk Lắk" />
    <meta property="og:title" content="Hệ thống Quản lý công việc & Đánh giá KPI - Phòng KHTC" />
    <meta property="og:description" content="Hệ thống Quản lý công việc và Đánh giá KPI - Phòng Kế hoạch Tài chính" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : function() { return Promise.reject(new Error("fetch not available")); };
          var _currentFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _currentFetch; },
              set: function(fn) { _currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              var proto = Object.getPrototypeOf(window);
              if (proto) {
                Object.defineProperty(proto, 'fetch', {
                  get: function() { return _currentFetch; },
                  set: function(fn) { _currentFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
