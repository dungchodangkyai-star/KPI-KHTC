name: Phat hanh KPI da phong ban

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Nhap ma phong ban trong config/deployments.json, hoac all"
        required: true
        type: string
        default: "khtc"
      confirm_release:
        description: "Tich chon de xac nhan phat hanh vao he thong dang su dung"
        required: true
        type: boolean
        default: false

concurrency:
  group: kpi-production-${{ inputs.deployment_target }}
  cancel-in-progress: false

jobs:
  quality:
    name: Kiem tra ma nguon chung
    if: ${{ inputs.confirm_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Chan du lieu that va cau hinh sao luu khoi ban phat hanh
        run: node scripts/check-no-live-data.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Xac minh package-lock.json
        shell: bash
        run: test -f package-lock.json || { echo "::error title=Thieu package-lock.json::Khong duoc phat hanh commit nay."; exit 1; }
      - run: npm ci
      - run: npm run validate:deployments
      - run: npm run lint
      - run: npm test
      - run: npm run build

  prepare:
    name: Chon phong ban phat hanh
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      project_id: ${{ steps.config.outputs.project_id }}
      region: ${{ steps.config.outputs.region }}
      artifact_repository: ${{ steps.config.outputs.artifact_repository }}
      image_name: ${{ steps.config.outputs.image_name }}
      workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
      service_account: ${{ steps.config.outputs.service_account }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        name: Doc danh sach trien khai
        shell: bash
        env:
          TARGET: ${{ inputs.deployment_target }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config/deployments.json', 'utf8'));
          const target = String(process.env.TARGET || '').trim().toLowerCase();
          const enabled = config.deployments.filter((item) => item.enabled !== false);
          const selected = target === 'all' ? enabled : enabled.filter((item) => item.code === target);
          if (!selected.length) throw new Error('Khong tim thay deployment dang bat: ' + target);
          const include = selected.map((item) => Object.assign({}, config.defaults, item));
          const lines = [
            'matrix=' + JSON.stringify({ include }),
            'project_id=' + config.defaults.projectId,
            'region=' + config.defaults.region,
            'artifact_repository=' + config.defaults.artifactRepository,
            'image_name=' + config.defaults.imageName,
            'workload_identity_provider=' + config.defaults.workloadIdentityProvider,
            'service_account=' + config.defaults.serviceAccount
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join('\n') + '\n');
          console.log('Se phat hanh: ' + selected.map((item) => item.code).join(', '));
          NODE

  build_image:
    name: Build mot image dung chung
    needs: [quality, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.prepare.outputs.workload_identity_provider }}
          service_account: ${{ needs.prepare.outputs.service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Dang nhap Artifact Registry
        run: gcloud auth configure-docker "${{ needs.prepare.outputs.region }}-docker.pkg.dev" --quiet
      - name: Build va day image duy nhat
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_uri="${{ needs.prepare.outputs.region }}-docker.pkg.dev/${{ needs.prepare.outputs.project_id }}/${{ needs.prepare.outputs.artifact_repository }}/${{ needs.prepare.outputs.image_name }}:$GITHUB_SHA"
          docker build --pull --tag "$image_uri" .
          docker push "$image_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

  release:
    name: Phat hanh ${{ matrix.code }}
    needs: [prepare, build_image]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ matrix.workloadIdentityProvider }}
          service_account: ${{ matrix.serviceAccount }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Kiem tra dich vu va luu revision hien tai
        id: current
        shell: bash
        env:
          PROJECT_ID: ${{ matrix.projectId }}
          REGION: ${{ matrix.region }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if ! service_json="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json)"; then
            echo "::error title=Chua tao Cloud Run service::Can khoi tao service $SERVICE truoc lan phat hanh dau tien."
            exit 1
          fi
          previous_revision="$(jq -r '.status.traffic[]? | select(.percent == 100) | .revisionName // empty' <<<"$service_json" | head -n1)"
          if [[ -z "$previous_revision" ]]; then previous_revision="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$service_json")"; fi
          [[ -n "$previous_revision" ]] || { echo "Khong xac dinh duoc revision dang phuc vu"; exit 1; }
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"

      - name: Xac minh secret CSDL va sao luu truoc phat hanh
        shell: bash
        env:
          PROJECT_ID: ${{ matrix.projectId }}
          DATABASE_SECRET: ${{ matrix.databaseSecret }}
          BACKUP_BUCKET: ${{ matrix.backupBucket }}
          DEPLOYMENT_CODE: ${{ matrix.code }}
        run: |
          set -euo pipefail
          database_url="$(gcloud secrets versions access latest --secret="$DATABASE_SECRET" --project="$PROJECT_ID")"
          [[ "$database_url" == postgres* ]] || { echo "Secret $DATABASE_SECRET khong phai PostgreSQL URL"; exit 1; }
          backup_file="$RUNNER_TEMP/$DEPLOYMENT_CODE-pre-release-${GITHUB_SHA::8}-$(date -u +%Y%m%dT%H%M%SZ).dump"
          docker run --rm --user "$(id -u):$(id -g)" --env DATABASE_URL="$database_url" \
            --volume "$RUNNER_TEMP:/backup" postgres:18-alpine \
            sh -c 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file="/backup/'"$(basename "$backup_file")"'"'
          unset database_url
          gcloud storage cp "$backup_file" "gs://$BACKUP_BUCKET/pre-release/$DEPLOYMENT_CODE/"

      - name: Tao revision ung vien va kiem tra dung phong ban
        id: deploy
        shell: bash
        env:
          PROJECT_ID: ${{ matrix.projectId }}
          REGION: ${{ matrix.region }}
          SERVICE: ${{ matrix.service }}
          IMAGE_URI: ${{ needs.build_image.outputs.image_uri }}
          PREVIOUS_REVISION: ${{ steps.current.outputs.previous_revision }}
          DATABASE_SECRET: ${{ matrix.databaseSecret }}
          DEPLOYMENT_CODE: ${{ matrix.code }}
          DEPLOYMENT_NAME: ${{ matrix.name }}
          DEPLOYMENT_SHORT_NAME: ${{ matrix.shortName }}
          PARENT_AGENCY: ${{ matrix.parentAgency }}
          ORG_LOCATION: ${{ matrix.location }}
          THEME_COLOR: ${{ matrix.themeColor }}
          FIXED_URL: ${{ matrix.fixedUrl }}
        run: |
          set -euo pipefail
          traffic_switched=0
          rollback() {
            if [[ "$traffic_switched" == "1" && -n "$PREVIOUS_REVISION" ]]; then
              gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
                --to-revisions="$PREVIOUS_REVISION=100" --quiet || true
            fi
          }
          trap rollback ERR
          jq -n --arg code "$DEPLOYMENT_CODE" --arg name "$DEPLOYMENT_NAME" --arg short "$DEPLOYMENT_SHORT_NAME" \
            --arg agency "$PARENT_AGENCY" --arg location "$ORG_LOCATION" --arg color "$THEME_COLOR" --arg url "$FIXED_URL" \
            --arg commit "$GITHUB_SHA" \
            '{DEPLOYMENT_CODE:$code,DEPLOYMENT_NAME:$name,DEPLOYMENT_SHORT_NAME:$short,PARENT_AGENCY:$agency,ORG_LOCATION:$location,THEME_COLOR:$color,APP_URL:$url,BUILD_COMMIT:$commit}' \
            > "$RUNNER_TEMP/deployment-env.json"
          suffix="$DEPLOYMENT_CODE-${GITHUB_SHA::7}"
          gcloud run services update "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --revision-suffix="$suffix" --no-traffic --tag=candidate --quiet \
            --image="$IMAGE_URI" --env-vars-file="$RUNNER_TEMP/deployment-env.json" \
            --update-secrets="DATABASE_URL=$DATABASE_SECRET:latest"
          service_json="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json)"
          new_revision="$(jq -r '.status.traffic[]? | select(.tag == "candidate") | .revisionName // empty' <<<"$service_json" | head -n1)"
          candidate_url="$(jq -r '.status.traffic[]? | select(.tag == "candidate") | .url // empty' <<<"$service_json" | head -n1)"
          [[ -n "$new_revision" && -n "$candidate_url" ]] || { echo "Khong tim thay revision ung vien"; exit 1; }
          healthy=0
          for attempt in {1..24}; do
            if response="$(curl --fail --silent --show-error --max-time 20 "$candidate_url/api/health" 2>/dev/null)"; then
              if jq -e --arg code "$DEPLOYMENT_CODE" --arg commit "$GITHUB_SHA" \
                '.status == "ok" and .connected == true and .storageMode == "postgres" and .schemaInitialized == true and .deployment.code == $code and .buildCommit == $commit' \
                <<<"$response" >/dev/null; then healthy=1; break; fi
            fi
            sleep 5
          done
          [[ "$healthy" == "1" ]] || { echo "Revision ung vien khong dung phong ban hoac CSDL chua san sang"; exit 1; }
          identity="$(curl --fail --silent --show-error --max-time 20 "$candidate_url/api/public/org-identity?release=$GITHUB_SHA")"
          jq -e --arg code "$DEPLOYMENT_CODE" --arg name "$DEPLOYMENT_NAME" --arg commit "$GITHUB_SHA" \
            '.success == true and .deployment.code == $code and .deployment.buildCommit == $commit and .data.departmentName == $name' \
            <<<"$identity" >/dev/null || { echo "Revision ung vien khong tra ve dung nhan dien cong khai/commit"; exit 1; }
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --to-revisions="$new_revision=100" --quiet
          traffic_switched=1
          production_ok=0
          for attempt in {1..18}; do
            if response="$(curl --fail --silent --show-error --max-time 20 "$FIXED_URL/api/health" 2>/dev/null)"; then
              if jq -e --arg code "$DEPLOYMENT_CODE" --arg commit "$GITHUB_SHA" \
                '.status == "ok" and .connected == true and .storageMode == "postgres" and .schemaInitialized == true and .deployment.code == $code and .buildCommit == $commit' \
                <<<"$response" >/dev/null; then production_ok=1; break; fi
            fi
            sleep 5
          done
          [[ "$production_ok" == "1" ]] || { echo "Link co dinh khong tra ve dung deployment"; exit 1; }
          identity="$(curl --fail --silent --show-error --max-time 20 "$FIXED_URL/api/public/org-identity?release=$GITHUB_SHA")"
          jq -e --arg code "$DEPLOYMENT_CODE" --arg name "$DEPLOYMENT_NAME" --arg commit "$GITHUB_SHA" \
            '.success == true and .deployment.code == $code and .deployment.buildCommit == $commit and .data.departmentName == $name' \
            <<<"$identity" >/dev/null || { echo "Link co dinh khong tra ve dung nhan dien cong khai/commit"; exit 1; }
          trap - ERR
          echo "new_revision=$new_revision" >> "$GITHUB_OUTPUT"

      - name: Ghi bien ban phat hanh
        shell: bash
        run: |
          {
            echo "## Phat hanh ${{ matrix.name }} thanh cong"
            echo "- Ma phong: ${{ matrix.code }}"
            echo "- Service: ${{ matrix.service }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Revision moi: ${{ steps.deploy.outputs.new_revision }}"
            echo "- Link co dinh: ${{ matrix.fixedUrl }}"
            echo "- CSDL: secret rieng ${{ matrix.databaseSecret }}, da sao luu truoc phat hanh"
          } >> "$GITHUB_STEP_SUMMARY"
